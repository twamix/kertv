name: Build and publish Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ghcr.io/${{ github.repository }}:build-${{ github.sha }}-${{ matrix.architecture }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Create multi-architecture manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          AMD64_IMAGE: ghcr.io/${{ github.repository }}:build-${{ github.sha }}-amd64
          ARM64_IMAGE: ghcr.io/${{ github.repository }}:build-${{ github.sha }}-arm64
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker buildx imagetools create \
              --tag "$tag" \
              "$AMD64_IMAGE" \
              "$ARM64_IMAGE"
          done <<< "$IMAGE_TAGS"

      - name: Remove temporary architecture images
        if: always()
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "Temporary image tags remain available for cache cleanup: ${IMAGE}:build-${GITHUB_SHA}-amd64 and ${IMAGE}:build-${GITHUB_SHA}-arm64"
